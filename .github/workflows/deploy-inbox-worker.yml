name: Deploy Inbox Worker

# 手动部署 Cloudflare Worker（inbox 收件箱 + 看板）。
# 只在 GitHub 页面手动触发（Actions → Deploy Inbox Worker → Run workflow），
# 不做自动部署。配置走 GitHub Secrets，仓库代码不含任何密钥。
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装依赖
        working-directory: worker
        run: npm install

      - name: 创建 R2 桶（幂等，首次才建）
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler r2 bucket create cunfetch-inbox || echo "bucket already exists or cannot access"

      - name: 设置 Worker 运行时 Secret（WORKER_API_TOKEN）
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "${{ secrets.WORKER_API_TOKEN }}" | npx wrangler secret put WORKER_API_TOKEN --name cunfetch

      - name: 部署 Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: 失败时报错
        if: failure()
        run: echo "::error::Inbox Worker 部署失败，请检查 CF_API_TOKEN / CF_ACCOUNT_ID / WORKER_API_TOKEN。"